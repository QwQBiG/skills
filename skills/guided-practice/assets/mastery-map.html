<!doctype html>
<html lang="und" dir="auto" data-gp-page>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>session.json</title>
<style>
  html[data-gp-page] { color-scheme: light dark; background: #fcfafb; }
  html[data-gp-page] body { margin: 0; padding: clamp(1.1rem, 5vw, 4rem) clamp(.8rem, 4vw, 2rem); }
  #gp-mastery {
    --ink: var(--foreground, #30272c); --quiet: var(--muted-foreground, #695d63);
    --line: var(--border, #dacfd4); --track: #e7d7de;
    --rose: #a7275c; --berry: #b44270; --amber: #925900; --wash: #faeaf0;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    -webkit-tap-highlight-color: rgb(188 44 104 / 15%);
    max-width: 48rem; margin-inline: auto; container-type: inline-size; color: var(--ink);
    font: 400 1rem/1.45 "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow-wrap: anywhere; text-align: start;
  }
  @media (prefers-color-scheme: dark) {
    html[data-gp-page] { background: #1c181b; }
    #gp-mastery {
      -webkit-tap-highlight-color: rgb(255 158 198 / 18%);
      --ink: var(--foreground, #f7eff3); --quiet: var(--muted-foreground, #cbb9c2);
      --line: var(--border, #52424a); --track: #624b56;
      --rose: #ff9ec6; --berry: #ee89b2; --amber: #ffd07e; --wash: #38252e;
    }
  }
  #gp-mastery *, #gp-mastery *::before, #gp-mastery *::after { box-sizing: border-box; }
  #gp-mastery [hidden] { display: none !important; }
  :where(#gp-mastery) :is(h1,h2,p,ol) { margin: 0; color: inherit; }
  #gp-mastery h1 { display: flex; gap: .5em; align-items: baseline; font: 650 clamp(1.45rem, 4.4cqi, 2.05rem)/1.25 var(--mono); }
  #gp-mastery h1::before { content: ""; flex: 0 0 .67em; height: .66em; background: var(--rose); clip-path: polygon(0 0, 26% 0, 68% 50%, 26% 100%, 0 100%, 42% 50%); }
  .gp-caption { margin-top: .45rem; color: var(--quiet); }
  .gp-heading, .gp-tools {
    display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .3rem .75rem;
  }
  .gp-heading {
    margin-top: 1.35rem; padding: .4rem .5rem; border-block: 1px solid var(--line);
    font: 500 .86rem/1.5 var(--mono);
  }
  #gp-mastery h2 { font: inherit; font-weight: 650; }
  .gp-key, .gp-status, .gp-check, .gp-scale li { color: var(--quiet); }
  .gp-key span + span { margin-inline-start: .6em; }
  .gp-goal::before { content: ""; display: inline-block; margin-inline: .1em .42em; width: 2px; height: .85em; background: var(--amber); vertical-align: -.08em; }
  .gp-ability { border-bottom: 1px solid var(--line); --bar: var(--rose); }
  .gp-ability[data-state="guided"] { --bar: var(--berry); }
  :where(#gp-mastery) summary { cursor: pointer; color: var(--ink); }
  .gp-ability > summary {
    display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr) minmax(3rem, 6.6rem) 2.6rem .6rem;
    align-items: center; gap: .1rem .65rem; padding: .57rem .5rem; list-style: none;
  }
  .gp-ability summary::-webkit-details-marker { display: none; }
  .gp-ability summary::after {
    content: ""; grid-area: 1 / 5; width: .4rem; height: .4rem; justify-self: center;
    border: solid var(--quiet); border-width: 0 1.5px 1.5px 0; transform: rotate(-45deg);
  }
  .gp-ability[open] summary::after { transform: rotate(45deg); }
  .gp-ability.is-focus > summary { box-shadow: inset 3px 0 var(--rose); background: var(--wash); }
  #gp-report:dir(rtl) .gp-ability.is-focus > summary { box-shadow: inset -3px 0 var(--rose); }
  #gp-report:dir(rtl) :is(h1,.gp-meter)::before, #gp-report:dir(rtl) .gp-ability:not([open]) summary::after { scale: -1 1; }
  .gp-ability > summary:focus-visible { outline: 2px solid var(--berry); outline-offset: -2px; }
  .gp-name { font-weight: 650; }
  .gp-focus { display: inline-block; margin-inline-start: .55em; color: var(--rose); font: 650 .78rem/1.4 var(--mono); }
  .gp-status, .gp-check, .gp-observation { font-size: .88rem; }
  .gp-status { grid-area: 1 / 2; }
  .gp-meter { position: relative; grid-area: 1 / 3; height: 7px; }
  .gp-meter::before {
    content: ""; display: block; height: 100%;
    background: linear-gradient(to right, var(--bar) calc(var(--score) * 20%), var(--track) 0);
    mask-image: repeating-linear-gradient(to right, #000 0 calc(20% - 2px), transparent calc(20% - 2px) 20%);
  }
  .gp-rows.with-goal .gp-meter::after {
    content: ""; position: absolute; inset-inline-start: clamp(0px, calc(var(--goal) * 20% - 2px), calc(100% - 2px));
    top: -3px; height: 13px; width: 2px; background: var(--amber);
  }
  .gp-score { grid-area: 1 / 4; text-align: end; font: 650 .95rem/1.4 var(--mono); }
  .gp-score.unscored { color: var(--quiet); }
  .gp-check { grid-column: 1 / -1; }
  .gp-check b { font-weight: 600; }
  .gp-observation { margin: .35rem .55rem .6rem; padding-inline-start: .65rem; border-inline-start: 2px solid var(--berry); }
  .gp-tools { padding: .45rem .5rem 0; }
  .gp-scale { flex: 1 1 11rem; }
  .gp-scale summary { width: fit-content; padding: .25rem 0; color: var(--quiet); font: 500 .85rem/1.5 var(--mono); }
  .gp-scale summary:focus-visible { outline: 2px solid var(--rose); }
  .gp-scale ol { padding-inline-start: 1.6rem; font-size: .87rem; }
  .gp-scale li { margin: .25rem 0; }
  .gp-scale li:empty { min-height: 1.45em; }
  .gp-scale li b { color: var(--ink); }
  .gp-shortcuts { display: flex; flex-wrap: wrap; align-items: baseline; gap: .3rem; font: 400 .78rem/1.5 var(--mono); color: var(--quiet); }
  #gp-mastery kbd { padding: 0 .23rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; font: inherit; color: var(--ink); }
  @container (max-width: 32rem) {
    .gp-ability > summary { grid-template-columns: minmax(0, 1fr) 3.1rem 2.2rem .5rem; column-gap: .4rem; }
    .gp-status { grid-area: 2 / 1 / 3 / -1; }
    .gp-meter { grid-area: 1 / 2; }
    .gp-score { grid-area: 1 / 3; }
    .gp-ability summary::after { grid-area: 1 / 4; }
  }
  @media (pointer: coarse) {
    #gp-mastery :is(.gp-ability > summary,.gp-scale summary) { min-height: 44px; }
    .gp-shortcuts { display: none; }
  }
  @media (forced-colors: active) {
    .gp-meter { forced-color-adjust: none; --bar: Highlight; --track: GrayText; --amber: CanvasText; }
    .gp-ability.is-focus > summary { border-inline-start: 3px solid Highlight; }
  }
</style>
<section id="gp-mastery">
  <article id="gp-report" aria-labelledby="gp-topic" hidden></article>
  <style id="gp-import-style">
    #gp-import { margin-block-start: .75rem; }
    #gp-import input { max-width: 100%; color: inherit; font: inherit; }
    #gp-import input::file-selector-button { padding: .5rem .7rem; color: var(--rose); border: 1px solid currentColor; border-radius: .3rem; background: transparent; cursor: pointer; }
    #gp-error { color: var(--rose); }
    @media (pointer: coarse) { #gp-import input::file-selector-button { min-height: 44px; } }
  </style>
  <div id="gp-import">
    <label>session.json <input type="file" accept=".json,application/json"></label>
    <p id="gp-error" role="alert"></p>
  </div>
  <template id="gp-layout">
    <header><h1 id="gp-topic">{{topic}}</h1>{{#summary}}<p class="gp-caption">{{summary}}</p>{{/summary}}</header>
    <div class="gp-heading">
      {{#evidence_label}}<h2>{{evidence_label}}</h2>{{/evidence_label}}
      <span class="gp-key">{{#current}}<span>{{current_label}} <bdi dir="ltr">{{current}}/5</bdi></span>{{/current}}{{#goal}}<span class="gp-goal">{{goal_label}} <bdi dir="ltr">{{goal}}/5</bdi>{{#goal_name}} · {{goal_name}}{{/goal_name}}</span>{{/goal}}</span>
    </div>
    <div class="gp-rows{{#goal}} with-goal{{/goal}}" style="--goal:{{goal}}">
    {{#abilities}}
    <details class="gp-ability{{#focus}} is-focus{{/focus}}" data-state="{{state}}">
      <summary>
        <span><b class="gp-name" dir="auto">{{name}}</b>{{#focus}}<span class="gp-focus">{{focus_label}}</span>{{/focus}}</span>
        <span class="gp-status">{{status}}</span>
        {{#level}}<span class="gp-meter" aria-hidden="true" style="--score:{{level}}"></span>{{/level}}
        <span class="gp-score{{^level}} unscored{{/level}}"><bdi dir="ltr">{{#level}}{{level}}/5{{/level}}{{^level}}—{{/level}}</bdi></span>
        {{#focus}}{{#next_check}}<span class="gp-check">{{#check_label}}<b>{{check_label}}</b> · {{/check_label}}{{next_check}}</span>{{/next_check}}{{/focus}}
      </summary>
      <div class="gp-observation"><p>{{evidence}}</p>{{^focus}}{{#next_check}}<span class="gp-check">{{#check_label}}<b>{{check_label}}</b> · {{/check_label}}{{next_check}}</span>{{/next_check}}{{/focus}}</div>
    </details>
    {{/abilities}}
    </div>
    <footer class="gp-tools">
      <details class="gp-scale">
        <summary>{{scale_label}}</summary>
        <ol start="0">{{#levels}}<li>{{#label}}<b>{{label}}</b>{{#meaning}} · {{/meaning}}{{/label}}{{meaning}}</li>{{/levels}}</ol>
      </details>
      <p class="gp-shortcuts" hidden><kbd dir="ltr">↑ ↓</kbd> / <kbd dir="ltr">j k</kbd>{{#move_label}} <span>{{move_label}}</span>{{/move_label}} <kbd>↵</kbd>{{#detail_label}} <span>{{detail_label}}</span>{{/detail_label}}</p>
    </footer>
  </template>
</section>
<script>
(() => {
  const root = document.getElementById("gp-mastery");
  const report = root.querySelector("#gp-report");
  const fileInput = root.querySelector("input");

  function text(value, key) {
    if (typeof value !== "string" || /[\x00-\x1f\x7f-\x9f]/.test(value)) throw Error(key);
    return value.trim();
  }
  function grade(value, key) {
    if (value !== null && !(Number.isInteger(value) && value >= 0 && value <= 5)) throw Error(key);
    return value;
  }
  // Both renderers expand this fixed template. Values are escaped once, after matching.
  function expand(markup, data) {
    const slots = /{{([#^])(\w+)}}([\s\S]*?){{\/\2}}|{{(\w+)}}/g;
    return markup.replace(slots, (_, kind, key, content, field) => {
      if (field) {
        const entities = {"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"};
        return String(data[field] ?? "").replace(/[&<>"']/g, char => entities[char]);
      }
      const value = data[key];
      if (Array.isArray(value)) return value.map(item => expand(content, {...data, ...item})).join("");
      const present = value != null && value !== false && value !== "";
      return present === (kind === "#") ? expand(content, data) : "";
    });
  }

  function show(source) {
    const captions = {lang: "und", dir: "auto", summary: "", scale_label: "0–5", evidence_label: "",
      current_label: "●", goal_label: "◎", focus_label: "✦", check_label: "→",
      move_label: "", detail_label: "", back_label: "", quit_label: "", page_label: ""};
    const data = {current: null, goal: 4, levels: Array.from({length: 6}, () => ({label: "", meaning: ""})),
      ...captions, ...source};
    for (const key of ["topic", ...Object.keys(captions)]) data[key] = text(data[key], key);
    if (!["auto", "ltr", "rtl"].includes(data.dir)) throw Error("dir");
    grade(data.current, "current");
    grade(data.goal, "goal");
    if (!Array.isArray(data.levels) || data.levels.length !== 6) throw Error("levels");
    data.levels = data.levels.map(item => ({label: text(item.label, "label"), meaning: text(item.meaning, "meaning")}));
    data.goal_name = data.goal === null ? "" : data.levels[data.goal].label;
    if (!Array.isArray(data.abilities)) throw Error("abilities");
    let hasFocus = false;
    data.abilities = data.abilities.map(({name, status, evidence, state, level = null, focus = false, next_check = ""}) => {
      grade(level, "ability level");
      if (!["guided", "observed", "unassessed"].includes(state) || (state === "unassessed" && level !== null)) throw Error("state");
      if (typeof focus !== "boolean" || (focus && hasFocus)) throw Error("focus");
      if (focus) hasFocus = true;
      return {name: text(name, "name"), status: text(status, "status"), evidence: text(evidence, "evidence"),
        state, level, focus, next_check: text(next_check, "next_check")};
    });
    report.innerHTML = expand(root.querySelector("#gp-layout").innerHTML, data);
    document.documentElement.lang = report.lang = data.lang;
    document.documentElement.dir = report.dir = data.dir;
    report.hidden = false;
    document.title = data.topic;
    report.dispatchEvent(new Event("gp-loaded"));
  }

  fileInput.addEventListener("change", async () => {
    const file = fileInput.files[0];
    if (!file) return;
    fileInput.disabled = true;
    const error = root.querySelector("#gp-error");
    try {
      show(JSON.parse(await file.text()));
      error.textContent = "";
    } catch (problem) {
      error.textContent = "⚠ " + file.name + " · " + problem.message;
    } finally {
      fileInput.value = "";
      fileInput.disabled = false;
    }
  });
})();
</script>
<script id="gp-keys">
(() => {
  const report = document.getElementById("gp-report");
  function prepareKeys() {
    const first = report.querySelector(".gp-ability > summary");
    if (!first) return;
    report.querySelector(".gp-shortcuts").hidden = false;
    if (document.documentElement.hasAttribute("data-gp-page") && matchMedia("(pointer: fine)").matches &&
        (document.activeElement === document.body || document.activeElement.matches("#gp-import input"))) {
      const selected = report.querySelector(".is-focus > summary") || first;
      selected.focus({preventScroll: true});
    }
  }
  prepareKeys();
  report.addEventListener("gp-loaded", prepareKeys);
  report.addEventListener("keydown", event => {
    if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey || event.defaultPrevented) return;
    if (!event.target.matches(".gp-ability > summary")) return;
    const direction = {ArrowDown: "nextElementSibling", j: "nextElementSibling", ArrowUp: "previousElementSibling", k: "previousElementSibling"}[event.key];
    const next = direction && event.target.parentElement[direction]?.querySelector("summary");
    if (next) {
      event.preventDefault();
      next.focus();
    }
  });
})();
</script>

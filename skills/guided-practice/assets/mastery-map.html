<style>
  #gp-mastery {
    --paper: var(--color-background-primary, #fbfaf6);
    --ink: var(--color-text-primary, #202d32);
    --muted: var(--color-text-secondary, #536268);
    --line: color-mix(in srgb, var(--ink) 21%, var(--paper));
    --wash: color-mix(in srgb, var(--ink) 5%, var(--paper));
    --focus: color-mix(in srgb, #338d80 55%, var(--ink));
    --serif: "Spectral", "Iowan Old Style", "Songti SC", Georgia, serif;
    font: 400 1rem/1.45 "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    container: gp-mastery / inline-size;
    width: 100%; max-width: 52rem; margin-inline: auto; text-align: start; overflow-wrap: anywhere;
    color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    #gp-mastery {
      --paper: var(--color-background-primary, #1b2326); --ink: var(--color-text-primary, #f0f0ea);
      --muted: var(--color-text-secondary, #c0caca);
    }
  }
  #gp-mastery, #gp-mastery *, #gp-mastery *::after { box-sizing: border-box; }
  #gp-mastery .gp-sheet { padding: clamp(.85rem, 4cqi, 2rem); }
  #gp-mastery :is(h2, h3, p) { margin: 0; color: inherit; }
  #gp-mastery h2 { font: 500 clamp(1.65rem, 5cqi, 2.5rem)/1.18 var(--serif); text-wrap: balance; }
  #gp-mastery header p { margin-top: .45rem; max-width: 66ch; color: var(--muted); }
  #gp-mastery header p:empty { display: none; }
  #gp-mastery .gp-heading {
    display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: .3rem 1rem;
    margin: 1.3rem 0 0; padding-bottom: .55rem; border-bottom: 1px solid var(--ink);
  }
  #gp-mastery h3 { font: 500 clamp(1.2rem, 3cqi, 1.45rem)/1.3 var(--serif); }
  #gp-mastery .gp-goal-key { color: var(--muted); font-size: .85rem; }
  #gp-mastery .gp-goal-key::before {
    content: ""; display: inline-block; width: 1em; height: .78em; margin-inline-end: .4em;
    border: 2px dashed currentColor; border-radius: 2px; vertical-align: -.04em;
  }
  #gp-mastery .gp-ability {
    --accent: #79898d; --strong: color-mix(in srgb, var(--accent) 55%, var(--ink));
    border-bottom: 1px solid var(--line);
  }
  #gp-mastery [data-state="observed"] { --accent: #179780; }
  #gp-mastery [data-state="guided"] { --accent: #d38a37; }
  #gp-mastery .is-focus { background: color-mix(in srgb, var(--focus) 7%, var(--paper)); }
  #gp-mastery summary { cursor: pointer; color: inherit; }
  #gp-mastery .gp-ability summary {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr) 2.3rem .65rem;
    align-items: center; gap: .4rem .75rem; padding: .75rem .6rem; list-style: none;
  }
  #gp-mastery .gp-ability summary::-webkit-details-marker { display: none; }
  #gp-mastery .gp-ability summary::after {
    content: ""; grid-area: 1 / 4; width: .45rem; height: .45rem; justify-self: center;
    border: solid var(--muted); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg);
  }
  #gp-mastery .gp-ability[open] summary::after { transform: rotate(225deg); }
  #gp-mastery summary:focus-visible, #gp-mastery .gp-choice:focus-visible + label { outline: 3px solid var(--focus); outline-offset: 1px; }
  #gp-mastery .gp-info { grid-area: 1 / 1; }
  #gp-mastery .gp-focus-label { color: var(--focus); font-weight: 700; font-size: .78rem; }
  #gp-mastery .gp-status { display: block; margin-top: .15rem; color: var(--strong); font-size: .86rem; }
  #gp-mastery .gp-score { grid-area: 1 / 3; color: var(--strong); font-weight: 700; text-align: end; font-variant-numeric: tabular-nums; }
  #gp-mastery .gp-strip { grid-area: 1 / 2; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .2rem; align-self: center; }
  #gp-mastery .gp-cell {
    position: relative; height: .62rem;
    border-radius: 3px; background: var(--wash); color: var(--muted);
  }
  #gp-mastery .gp-cell.is-past { background: color-mix(in srgb, var(--accent) 65%, var(--paper)); color: var(--ink); }
  #gp-mastery .gp-cell.is-score { background: var(--strong); color: var(--paper); }
  #gp-mastery .gp-strip.is-unscored { height: .62rem; background: linear-gradient(90deg, var(--line) 45%, transparent 45%) left center / 7px 1px repeat-x; }
  #gp-mastery .gp-strip.is-unscored .gp-cell { visibility: hidden; }
  #gp-mastery .gp-cell.is-goal::after { content: ""; position: absolute; inset: -2px 0; border: 1px dashed var(--muted); border-radius: 2px; }
  #gp-mastery .gp-check, #gp-mastery .gp-observation { color: var(--muted); font-size: .89rem; }
  #gp-mastery .gp-check { display: block; grid-column: 1 / -1; }
  #gp-mastery .gp-observation { padding: 0 .6rem .75rem; }
  #gp-mastery .gp-observation .gp-check { margin-top: .35rem; }
  #gp-mastery .gp-scale > summary { padding: .8rem 0 .5rem; font-weight: 600; }
  #gp-mastery .gp-steps { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .3rem; }
  #gp-mastery .gp-choice { position: absolute; width: 1px; height: 1px; clip-path: inset(50%); overflow: hidden; }
  #gp-mastery .gp-step label { display: block; height: 100%; padding: .4rem; border: 1px solid var(--line); border-radius: 4px; font-size: .84rem; cursor: pointer; }
  #gp-mastery .gp-choice:checked + label { background: var(--wash); border-color: var(--ink); }
  #gp-mastery .gp-role { display: block; color: var(--muted); font-size: .76rem; }
  #gp-mastery .gp-meaning { margin-top: .45rem; color: var(--muted); font-size: .9rem; }
  @supports selector(:has(*)) {
    #gp-mastery .gp-meaning { display: none; }
    #gp-mastery:has(#gp-level-0:checked) .gp-meaning[data-level="0"],
    #gp-mastery:has(#gp-level-1:checked) .gp-meaning[data-level="1"],
    #gp-mastery:has(#gp-level-2:checked) .gp-meaning[data-level="2"],
    #gp-mastery:has(#gp-level-3:checked) .gp-meaning[data-level="3"],
    #gp-mastery:has(#gp-level-4:checked) .gp-meaning[data-level="4"],
    #gp-mastery:has(#gp-level-5:checked) .gp-meaning[data-level="5"] { display: block; }
  }
  @container gp-mastery (max-width: 32rem) {
    #gp-mastery .gp-ability summary { grid-template-columns: minmax(0, 1fr) 2.3rem .65rem; }
    #gp-mastery .gp-score { grid-area: 1 / 2; }
    #gp-mastery .gp-ability summary::after { grid-area: 1 / 3; }
    #gp-mastery .gp-strip { grid-area: 2 / 1 / 3 / -1; }
    #gp-mastery .gp-steps { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (forced-colors: active) {
    #gp-mastery .gp-cell.is-past { border-bottom: 3px solid CanvasText; }
    #gp-mastery .gp-cell.is-score { forced-color-adjust: none; background: Highlight; color: HighlightText; }
    #gp-mastery .gp-choice:checked + label { outline: 2px solid Highlight; }
  }
</style>
<section id="gp-mastery" lang="@@LANG@@" aria-labelledby="gp-topic">
  <div class="gp-sheet">
    <header><h2 id="gp-topic">@@TOPIC@@</h2><p>@@SUMMARY@@</p></header>
    <section aria-labelledby="gp-evidence-title">
      <div class="gp-heading"><h3 id="gp-evidence-title">@@EVIDENCE_LABEL@@</h3>@@GOAL_KEY@@</div>
      @@ABILITIES@@
    </section>
    <details class="gp-scale">
      <summary>@@SCALE_LABEL@@</summary>
      <div class="gp-steps" role="radiogroup" aria-label="@@SCALE_LABEL@@">@@STEPS@@</div>
      <div class="gp-meanings" aria-live="polite" aria-atomic="true">@@MEANINGS@@</div>
    </details>
  </div>
</section>
